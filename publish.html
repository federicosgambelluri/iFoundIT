<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Pubblica un oggetto - iFoundIT</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>iFoundIT</h1>
  </header>

  <div class="container">
    <h2>Pubblica un oggetto trovato</h2>
    <form id="publish-form" enctype="multipart/form-data">
      <div class="form-group">
        <label for="title">Titolo</label>
        <input type="text" class="form-control" id="title" placeholder="Titolo" required>
      </div>
      <div class="form-group">
        <label for="description">Descrizione</label>
        <textarea class="form-control" id="description" rows="3" placeholder="Descrizione" required></textarea>
      </div>
      <div class="form-group">
        <label for="location">Luogo</label>
        <input type="text" class="form-control" id="location" placeholder="Luogo" required>
      </div>
      <div class="form-group">
        <label for="contact">Contatto (opzionale)</label>
        <input type="text" class="form-control" id="contact" placeholder="Email o telefono">
      </div>
      <div class="form-group">
        <label for="image">Immagine (opzionale)</label>
        <input type="file" class="form-control-file" id="image">
      </div>
      <button type="submit" class="btn btn-primary">Pubblica</button>
    </form>
  </div>

  <footer>
    &copy; 2023 iFoundIT
  </footer>

  <script src="js/scripts.js"></script>
  <script>
    document.getElementById('publish-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('location', document.getElementById('location').value);
      formData.append('contact', document.getElementById('contact').value);
      const imageFile = document.getElementById('image').files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      fetch('/api/items', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        alert('Articolo pubblicato con successo!');
        window.location.href = 'index.html';
      })
      .catch(error => {
        console.error('Errore:', error);
      });
    });
  </script>
</body>
</html>
